name: Build companion exe

# Compila vsd-fuel-bridge.exe su un runner Windows ad ogni push su main
# che tocca companion/ — nessun pilota deve avere Python installato.
#
# Pubblica l'exe in DUE posti:
#  1. Artifact della run (richiede login GitHub, utile per lo staff/QA)
#  2. GitHub Release pubblica a tag fisso "companion-latest" (NESSUN
#     login richiesto — questo è il link da dare ai piloti). Ogni push
#     sovrascrive l'asset della stessa release, quindi il link resta
#     sempre identico: non va ricondiviso ad ogni aggiornamento.
#
# Nota per chi lo riceve: l'exe non è firmato digitalmente (una firma
# codice richiede un'identità aziendale registrata a pagamento), quindi
# Windows SmartScreen mostrerà "Windows ha protetto il PC" al primo
# avvio — è normale, va cliccato "Ulteriori informazioni" → "Esegui
# comunque". Vedi companion/README.md per i dettagli da dare ai piloti.

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/build-companion.yml'
  workflow_dispatch: {}

jobs:
  build-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa PyInstaller
        run: pip install pyinstaller

      - name: Build exe
        # --paths/--hidden-import: lmu_data.py è importato a runtime via
        # sys.path.insert (vedi fuel_bridge.py), che l'analisi statica
        # di PyInstaller non vede da sola — senza questi due flag l'exe
        # compila ma crasha al primo avvio con ModuleNotFoundError.
        run: pyinstaller --onefile --name vsd-fuel-bridge --paths vendor --hidden-import lmu_data fuel_bridge.py

      - uses: actions/upload-artifact@v4
        with:
          name: vsd-fuel-bridge-exe
          path: companion/dist/vsd-fuel-bridge.exe
          retention-days: 90

      - name: Pubblica/aggiorna la Release pubblica (companion-latest)
        uses: ncipollo/release-action@v1
        with:
          tag: companion-latest
          commit: main
          name: "Companion — build automatica"
          body: >
            Build automatica dell'ultimo commit su companion/. Scarica
            vsd-fuel-bridge.exe qui sotto — link stabile, nessun login
            richiesto. Guida d'uso: companion/README.md.
          artifacts: companion/dist/vsd-fuel-bridge.exe
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
